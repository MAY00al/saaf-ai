[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "saaf"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.0,<2",
    "fastapi>=0.115,<1",
    "langchain-openai>=1,<2",
    "langchain-google-genai>=4,<5",
    "langgraph>=1,<2",
    "pydantic>=2,<3",
    "pyproj>=3.6,<4",
    "python-dotenv>=1,<2",
    "typing-extensions>=4.10,<5",
    "shapely>=2,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "Pillow>=10,<13", "httpx>=0.27,<1"]
vision = ["ultralytics>=8.3,<9", "Pillow>=10,<13"]
satellite = ["earthengine-api>=1,<2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
