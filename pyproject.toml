[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "saaf"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["chromadb>=1.0,<2", "langchain-openai>=1,<2", "pydantic>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
